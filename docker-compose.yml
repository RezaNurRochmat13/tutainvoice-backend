services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuta
      POSTGRES_PASSWORD: tuta
      POSTGRES_DB: invoice
    ports:
      - '5442:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuta -d invoice']
      interval: 5s
      timeout: 5s
      retries: 5
  
  db-test:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuta
      POSTGRES_PASSWORD: tuta
      POSTGRES_DB: invoice_test
    ports:
      - '5443:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuta -d invoice_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
